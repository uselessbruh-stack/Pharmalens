name: Research integrity and API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
  foundation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-foundation.lock
      - name: Install CPU runtime
        run: python -m pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned foundation
        run: python -m pip install -r requirements-foundation.lock
      - name: Validate dependencies
        run: python -m pip check
      - name: Offline regression suite
        run: python -m pytest -q
      - name: Downloader dry run
        run: python scripts/download_datasets.py --dry-run
